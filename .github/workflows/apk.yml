name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          mkdir www && cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "12C Classic" com.vitor.hp12c --web-dir=www
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity /<activity android:screenOrientation="landscape" /' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE"/><application#' $M
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: 12c-classic-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
